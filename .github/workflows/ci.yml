name: CI

# Pull requests had no checks at all before this: deploy.yml only fires on push to
# main, so a dependency bump's first real verification would have been production.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input — the action reads `packageManager` from package.json, and
      # supplying both is an error.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:run

      # Deliberately built without the Supabase variables. Dependabot-triggered runs
      # read a separate variable store and would see them empty anyway, and the values
      # only ever land in strings — nothing about compilation, types or tests depends
      # on them. What this proves is that the code still builds.
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /raduler
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true
