name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job reads the repo, the deploy job gets the Pages
# write + OIDC pair it needs and nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs, not moving tags, so a compromised
# tag cannot silently change what runs in CI.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # No `version:` input — the action reads `packageManager` from package.json, and
      # supplying both is an error.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:run

      - name: Audit dependencies
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Build static export
        env:
          # Repository *variables*, not secrets. The anon key is publishable by design
          # and RLS is what protects the data; storing it as a secret would only mask
          # it in logs while it still ships inside the JS bundle.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /raduler
        run: pnpm build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
